# Regras comuns aos dois modos (HTTP e HTTPS): tela, API, limites e cabeçalhos de segurança.
# Incluído por http.conf e https.conf.
root /usr/share/nginx/html;
index index.html;

# Não diz a versão do nginx nas respostas e páginas de erro
server_tokens off;
# Nenhuma tela manda arquivos: corpo de requisição pequeno
client_max_body_size 1m;

# ---------- Cabeçalhos de segurança (valem para todas as respostas) ----------
# CSP: a página só carrega scripts, estilos, fontes e imagens do próprio sistema
# e só conversa com a própria API. Bloqueia scripts injetados (XSS).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# O sistema não pode ser aberto dentro de outro site (clickjacking)
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Erro de limite em JSON, no mesmo formato dos erros da API
error_page 429 = @muitas_tentativas;
location @muitas_tentativas {
    default_type application/json;
    return 429 '{"status":429,"erro":"Muitas tentativas seguidas. Aguarde um minuto e tente de novo.","campos":{}}';
}

# A tela chama a API em /api (caminho relativo); o nginx repassa para o Spring Boot.
# "backend" é o nome do serviço no docker-compose.yml.
location = /api/login {
    if ($outro_site) {
        return 403 '{"status":403,"erro":"Chamada de outro site recusada.","campos":{}}';
    }
    limit_req zone=login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A tela e a API saem do mesmo endereço (este nginx), então não há chamada "de outro site".
    # Sem isto o Spring recusava (403) quem abrisse por 127.0.0.1 ou pelo IP da rede.
    # (Não abre brecha: a API usa token no cabeçalho, não cookie, então não existe CSRF.)
    proxy_set_header Origin "";
    # O backend já manda estes dois: não repetir
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
}

location /api/ {
    if ($outro_site) {
        return 403 '{"status":403,"erro":"Chamada de outro site recusada.","campos":{}}';
    }
    limit_req zone=api burst=40 nodelay;
    limit_req_status 429;
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    # Endereço verdadeiro de quem chamou (o backend usa para o bloqueio de senhas e o registro)
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A tela e a API saem do mesmo endereço (este nginx), então não há chamada "de outro site".
    # Sem isto o Spring recusava (403) quem abrisse por 127.0.0.1 ou pelo IP da rede.
    # (Não abre brecha: a API usa token no cabeçalho, não cookie, então não existe CSRF.)
    proxy_set_header Origin "";
    # O backend já manda estes dois: não repetir
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
}

# Certificado do Lar para instalar nos tablets e celulares (só existe no modo HTTPS)
location = /certificado-lar.crt {
    default_type application/x-x509-ca-cert;
    add_header Content-Disposition 'attachment; filename="certificado-lar.crt"';
    add_header Cache-Control "no-cache";
}

# Arquivos de chave/certificado nunca são servidos (nem caem na tela inicial)
location ~* \.(?:key|pem|csr|srl|cnf)$ {
    return 404;
}

# Arquivos escondidos (.git, .env...) nunca são servidos
location ~ /\. {
    deny all;
    return 404;
}

# Arquivos com hash no nome (main-ABC123.js) nunca mudam: o navegador pode guardar.
# (add_header aqui dentro substitui os de cima, por isso a política é repetida)
location ~* \.(?:js|css|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
}

# Rotas do Angular (/moradores, /consulta...) caem no index.html, que não deve ficar em cache
location / {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    try_files $uri $uri/ /index.html;
}
