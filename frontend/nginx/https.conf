# Modo HTTPS (opcional: USAR_HTTPS=sim no .env). Para quando tablets ou celulares
# usarem o sistema pelo Wi-Fi: senhas, tokens e dados das pessoas trafegam criptografados.
# O certificado é gerado pelo certificado.sh na primeira vez que o sistema liga.
server {
    listen 8080 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certificados/servidor.crt;
    ssl_certificate_key /etc/nginx/certificados/servidor.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # Quem digitar http:// nesta porta (atalho antigo, por exemplo) vai para o https:// do mesmo endereço.
    # (497 é o código do nginx para "chegou HTTP comum numa porta HTTPS"; $http_host mantém o IP e a porta)
    # 302 (temporário) e não 301: o navegador não "decora" o redirecionamento, então desligar o HTTPS depois não quebra nada
    error_page 497 =302 https://$http_host$request_uri;

    include /etc/nginx/portaria/portaria-comum.conf;
}
