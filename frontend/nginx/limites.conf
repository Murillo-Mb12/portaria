# Limite de tentativas de login por aparelho: 10 por minuto (com folga de 5 seguidas).
# Junto com o bloqueio do backend (5 senhas erradas = 15 min), segura robôs testando senhas.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
# Limite geral da API por aparelho, folgado para o uso normal da portaria
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

# Chamadas à API vindas de OUTRO site (uma página maliciosa aberta neste computador, por exemplo)
# são recusadas. Vale quando o navegador manda "Origin" diferente do endereço do próprio sistema.
# Sem "Origin" (navegação comum, curl) ou com o mesmo endereço = permitido.
map "$http_origin|$scheme://$http_host" $outro_site {
    default             1;
    "~^\|"              0;
    "~*^([^|]+)\|\1$"   0;
}
