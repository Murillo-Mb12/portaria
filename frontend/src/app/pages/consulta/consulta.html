<header class="cabecalho-pagina">
  <h1>Consulta de acessos</h1>
</header>

<section class="card" aria-labelledby="titulo-filtros">
  <h2 class="titulo-cartao" id="titulo-filtros">Filtros</h2>
  <form class="grid filtros" [formGroup]="filtro" (ngSubmit)="$event.preventDefault()">
    <label>Buscar
      <input type="search" formControlName="busca" placeholder="Nome, placa, morador ou porteiro" autocomplete="off">
    </label>
    <div class="campo">
      <span class="titulo-campo" id="rotulo-periodo">Período</span>
      <div class="segmentado" role="group" aria-labelledby="rotulo-periodo">
        @for (a of atalhos; track a.valor) {
          <button type="button" class="segmento" [class.ativo]="atalho() === a.valor"
                  [attr.aria-pressed]="atalho() === a.valor" (click)="usarAtalho(a.valor)">{{ a.rotulo }}</button>
        }
      </div>
    </div>
    <label>De <input formControlName="de" type="date" [max]="filtro.controls.ate.value" (change)="aoMudarData()"></label>
    <label>Até <input formControlName="ate" type="date" [min]="filtro.controls.de.value" (change)="aoMudarData()"></label>
    <button type="button" class="sec" (click)="limpar()">Limpar filtros</button>
  </form>
  @if (erro()) { <p class="err" role="alert">{{ erro() }}</p> }
</section>

<section class="card tabela-scroll" aria-labelledby="titulo-resultado" [attr.aria-busy]="carregando()">
  <h2 class="titulo-cartao" id="titulo-resultado">Acessos encontrados <span class="contagem">{{ acessos().length }}</span></h2>
  <app-tabela-acessos [acessos]="acessos()" [carregando]="carregando()"
                      vazio="Nenhum acesso encontrado com estes filtros. Tente outro período ou outra busca." />
</section>
