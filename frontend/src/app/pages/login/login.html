<div class="pagina-login">
  <div class="painel-login">
    <div class="identidade">
      <img class="emblema" src="logo-lsvp.png" alt="Emblema da Sociedade de São Vicente de Paulo">
      <strong>Lar São Vicente de Paulo</strong>
      <span>Sistema de Portaria</span>
    </div>

    <form class="login" [formGroup]="form" (ngSubmit)="entrar()">
      <h1>Acesso ao sistema</h1>

      <label>Usuário
        <input formControlName="usuario" autocomplete="username" autofocus>
      </label>

      <label>Senha
        <span class="campo-senha">
          <input formControlName="senha" [type]="mostrarSenha() ? 'text' : 'password'" autocomplete="current-password">
          <button type="button" class="mostrar" (click)="mostrarSenha.set(!mostrarSenha())"
                  [attr.aria-pressed]="mostrarSenha()">
            {{ mostrarSenha() ? 'Ocultar' : 'Mostrar' }}
          </button>
        </span>
      </label>

      <button type="submit" class="entrar" [disabled]="carregando()">
        {{ carregando() ? 'Entrando...' : 'Entrar' }}
      </button>

      @if (erro()) {
        <p class="err">{{ erro() }}</p>
      }
    </form>

    <p class="rodape">Acesso restrito a funcionários autorizados.<br>Demonstração: porteiro / 1234 ou admin / admin123</p>
  </div>
</div>
