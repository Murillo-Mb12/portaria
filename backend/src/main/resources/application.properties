# =====================================================
# Aula 04: application.properties (sempre carregado)
# =====================================================
spring.application.name=portaria
server.port=8080

# Aula 05: Seeding -> Flyway (src/main/resources/db/migration)
# V1 = tabelas, V2 = dados de exemplo, V3 = veículo opcional na entrada.
# O Hibernate NÃO cria tabelas.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# -----------------------------------------------------
# Banco PADRÃO: H2 em memória (não precisa instalar nada).
# Para usar PostgreSQL, ative o perfil "postgre"
# (veja application-postgre.properties).
# -----------------------------------------------------
spring.datasource.url=jdbc:h2:mem:portariadb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

# Aula 06: H2-Console -> http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:portariadb | User: sa | Password: (vazio)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
