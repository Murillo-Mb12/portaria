# =====================================================
# Perfil "h2": roda SEM PostgreSQL, com banco em memória.
# Ative com: mvnw spring-boot:run -Dspring-boot.run.profiles=h2
# (ou adicione spring.profiles.active=h2 no application.properties)
# As mesmas migrações do Flyway são executadas aqui.
# =====================================================
spring.datasource.url=jdbc:h2:mem:portariadb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

# Aula 06: H2-Console -> http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:portariadb | User: sa | Password: (vazio)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
