# =====================================================
# Aula 04: application.properties
# =====================================================
spring.application.name=portaria
server.port=8080

# -----------------------------------------------------
# Banco de dados: PostgreSQL
# Os valores depois de ":" são o padrão. Para mudar sem editar o arquivo,
# crie as variáveis de ambiente DB_URL, DB_USER e DB_PASSWORD.
# -----------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/portariadb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# -----------------------------------------------------
# Aula 05: Seeding -> agora feito pelo Flyway
# As tabelas e os dados iniciais ficam em src/main/resources/db/migration
# (V1 = tabelas, V2 = dados de exemplo). O Hibernate NÃO cria tabelas.
# -----------------------------------------------------
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Aula 06: H2-Console só funciona no perfil h2 (veja application-h2.properties)
spring.h2.console.enabled=false
