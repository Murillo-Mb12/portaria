# =====================================================
# Perfil "postgre": usa o PostgreSQL no lugar do H2.
# Ative de uma destas formas:
#   - no arquivo .env da raiz:  SPRING_PROFILES_ACTIVE=postgre
#   - pelo terminal:            mvnw spring-boot:run "-Dspring-boot.run.profiles=postgre"
# Os valores depois de ":" são o padrão; DB_URL, DB_USER e DB_PASSWORD
# podem ser definidos no .env.
# =====================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/portariadb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.h2.console.enabled=false
